<div class="auth-wrapper d-flex align-items-center justify-content-center">
  <div class="card auth-card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-file-earmark-person-fill text-primary display-5"></i>
        <h3 class="fw-bold mt-2 mb-0">Create your account</h3>
        <p class="text-muted small">Start optimizing your resume and practicing interviews</p>
      </div>

      <form (ngSubmit)="submit()" #f="ngForm">
        <div class="mb-3">
          <label class="form-label small">Full name</label>
          <input type="text" class="form-control" name="name" [(ngModel)]="name" required placeholder="Jane Doe" />
        </div>
        <div class="mb-3">
          <label class="form-label small">Email address</label>
          <input type="email" class="form-control" name="email" [(ngModel)]="email" required placeholder="you@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" class="form-control" name="password" [(ngModel)]="password" required placeholder="At least 6 characters" />
        </div>
        <div class="mb-3">
          <label class="form-label small">Target job role <span class="text-muted">(optional)</span></label>
          <input type="text" class="form-control" name="targetJobRole" [(ngModel)]="targetJobRole" placeholder="e.g. Frontend Engineer" />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) { <span class="spinner-border spinner-border-sm me-2"></span> }
          Create Account
        </button>
      </form>

      <p class="text-center small text-muted mt-4 mb-0">
        Already have an account? <a routerLink="/auth/login">Log in</a>
      </p>
    </div>
  </div>
</div>
