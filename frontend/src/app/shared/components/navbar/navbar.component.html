<nav class="navbar navbar-expand-lg border-bottom sticky-top app-navbar px-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" routerLink="/">
      <i class="bi bi-file-earmark-person-fill text-primary"></i>
      ResumeAI <span class="text-primary">Pro</span>
    </a>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <button class="btn btn-sm btn-outline-secondary" (click)="theme.toggle()" title="Toggle theme">
        <i class="bi" [class.bi-moon-stars]="theme.theme() === 'light'" [class.bi-sun]="theme.theme() === 'dark'"></i>
      </button>

      @if (auth.isLoggedIn()) {
        <div class="dropdown" [class.show]="menuOpen()">
          <button
            type="button"
            class="btn btn-sm btn-primary dropdown-toggle d-flex align-items-center gap-2"
            [attr.aria-expanded]="menuOpen()"
            (click)="toggleMenu()"
          >
            <i class="bi bi-person-circle"></i>
            {{ auth.currentUser()?.name }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end" [class.show]="menuOpen()">
            <li><a class="dropdown-item" routerLink="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li><a class="dropdown-item" routerLink="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
            @if (auth.isAdmin()) {
              <li><a class="dropdown-item" routerLink="/admin"><i class="bi bi-shield-lock me-2"></i>Admin Panel</a></li>
            }
            <li><hr class="dropdown-divider" /></li>
            <li><button type="button" class="dropdown-item text-danger" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
          </ul>
        </div>
      } @else {
        <a routerLink="/auth/login" class="btn btn-sm btn-outline-primary">Login</a>
        <a routerLink="/auth/register" class="btn btn-sm btn-primary">Sign Up</a>
      }
    </div>
  </div>
</nav>
